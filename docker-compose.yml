# MEDUSA 2026 web service + .d converter sidecar.
#
#   docker compose up --build      # from this directory (medusa_web/)
#   open http://localhost:8000
#
# The `converter` service (msconvert under wine) runs on-demand: the web service
# drops a job file into the shared uploads volume; the converter picks it up.
# First start pulls a multi-GB image (vendor-licensed Agilent drivers).
#
# The spectra folder (local path or NFS mount) is read-only mounted at /data/spectra.
# Set SPECTRA_DIR in the shell or in a .env file next to this compose file, e.g.:
#   SPECTRA_DIR=/mnt/nfs/medusa_spectra
#   docker compose up --build
services:
  web:
    build:
      # The build context is the PARENT directory so the Dockerfile can also
      # copy MEDUSA2026/mass_automation and the two model files.
      context: ..
      dockerfile: medusa_web/Dockerfile
    image: medusa2026-web:latest
    container_name: medusa2026-web
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PORT: "8000"
      SPECTRA_DIR: /data/spectra
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-1024}"
      CONVERT_TIMEOUT_MIN: "${CONVERT_TIMEOUT_MIN:-60}"
      MAX_ACTIVE_SESSIONS: "${MAX_ACTIVE_SESSIONS:-32}"
      MAX_CONCURRENT_CPU_JOBS: "${MAX_CONCURRENT_CPU_JOBS:-2}"
      DELETE_UPLOADS_ON_SESSION_RESET: "${DELETE_UPLOADS_ON_SESSION_RESET:-false}"
    volumes:
      - ${SPECTRA_DIR:-./spectra}:/data/spectra:ro
      - medusa_uploads:/data/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  converter:
    # Agilent .d -> mzXML via Proteowizard msconvert under wine.
    # Idle-watches the shared uploads volume; processes one job at a time.
    image: chambm/pwiz-skyline-i-agree-to-the-vendor-licenses
    container_name: medusa2026-converter
    environment:
      WINEDEBUG: "-all"
    volumes:
      - medusa_uploads:/data/uploads
      - ./converter/entrypoint.sh:/entrypoint.sh:ro
    command: ["sh", "/entrypoint.sh"]
    restart: unless-stopped

volumes:
  medusa_uploads:
